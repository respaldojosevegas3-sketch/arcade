<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mines — Arcade Platform</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <div id="authBox" style="max-width: 320px; margin: 0 auto 20px; padding: 16px; background: #1a1f2e; border-radius: 8px;">
      <div id="loginForm">
        <input id="authEmail" type="email" placeholder="Email" style="width: 100%; margin-bottom: 8px; padding: 8px;" />
        <input id="authPassword" type="password" placeholder="Contraseña" style="width: 100%; margin-bottom: 8px; padding: 8px;" />
        <div id="authError" style="color: #ff6b6b; font-size: 13px; margin-bottom: 8px;"></div>
        <button id="loginBtn" style="width: 48%; margin-right: 4%;">Entrar</button>
        <button id="registerBtn" style="width: 48%;">Registrarme</button>
      </div>
      <div id="loggedInBox" style="display: none;">
        <span id="loggedInEmail"></span>
        <button id="logoutBtn" style="float: right;">Salir</button>
      </div>
    </div>

    <header class="topbar">
      <div class="balance">
        <span class="label">Saldo</span>
        <span class="value" id="balanceValue">-- USDT</span>
      </div>
      <div class="multiplier-badge" id="multiplierBadge">1.00x</div>
    </header>
    <main class="board-wrap">
      <div id="board" class="board"></div>
      <p id="statusMsg" class="status-msg"></p>
    </main>
    <footer class="controls">
      <div class="control-row">
        <label for="betAmount">Apuesta (USDT)</label>
        <input type="number" id="betAmount" value="1" min="1" step="0.5" />
      </div>
      <div class="control-row">
        <label for="mineCount">Minas</label>
        <select id="mineCount">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="24">24</option>
        </select>
      </div>
      <div class="action-row">
        <button id="startBtn" class="btn btn-primary">Iniciar partida</button>
        <button id="cashoutBtn" class="btn btn-success" disabled>Cobrar</button>
      </div>
    </footer>
  </div>

  <script src="auth.js"></script>
  <script src="game.js"></script>
  <script>
    const authErrorEl = document.getElementById('authError');
    const loginFormEl = document.getElementById('loginForm');
    const loggedInBoxEl = document.getElementById('loggedInBox');
    const loggedInEmailEl = document.getElementById('loggedInEmail');

    function refreshAuthUI(email) {
      if (isLoggedIn()) {
        loginFormEl.style.display = 'none';
        loggedInBoxEl.style.display = 'block';
        loggedInEmailEl.textContent = email || '';
      } else {
        loginFormEl.style.display = 'block';
        loggedInBoxEl.style.display = 'none';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      authErrorEl.textContent = '';
      try {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        await login(email, password);
        window.location.reload();
      } catch (err) {
        authErrorEl.textContent = err.message === 'INVALID_CREDENTIALS'
          ? 'Email o contraseña incorrectos.'
          : 'No se pudo iniciar sesión.';
      }
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
      authErrorEl.textContent = '';
      try {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        await register(email, password);
        window.location.reload();
      } catch (err) {
        authErrorEl.textContent = err.message === 'EMAIL_TAKEN'
          ? 'Ese email ya está registrado.'
          : 'No se pudo registrar (contraseña mínimo 6 caracteres).';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);

    refreshAuthUI();
  </script>
</body>
</html>
