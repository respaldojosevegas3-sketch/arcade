<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mines — Arcade Platform</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="balance">
        <span class="label">Saldo</span>
        <span class="value" id="balanceValue">-- USDT</span>
      </div>
      <div class="multiplier-badge" id="multiplierBadge">1.00x</div>
    </header>

    <main class="board-wrap">
      <div id="board" class="board"></div>
      <p id="statusMsg" class="status-msg"></p>
    </main>

    <footer class="controls">
      <div class="control-row">
        <label for="betAmount">Apuesta (USDT)</label>
        <input type="number" id="betAmount" value="1" min="1" step="0.5" />
      </div>

      <div class="control-row">
        <label for="mineCount">Minas</label>
        <select id="mineCount">
          <option value="1">1</option>
          <option value="3" selected>3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="24">24</option>
        </select>
      </div>

      <div class="action-row">
        <button id="startBtn" class="btn btn-primary">Iniciar partida</button>
        <button id="cashoutBtn" class="btn btn-success" disabled>Cobrar</button>
      </div>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
