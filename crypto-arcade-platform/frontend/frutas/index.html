<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Frutas — Arcade Platform</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <div id="authBox" style="max-width: 320px; margin: 0 auto 20px; padding: 16px; background: #1a1f2e; border-radius: 8px;">
      <div id="loginForm">
        <input id="authEmail" type="email" placeholder="Email" style="width: 100%; margin-bottom: 8px; padding: 8px;" />
        <input id="authPassword" type="password" placeholder="Contraseña" style="width: 100%; margin-bottom: 8px; padding: 8px;" />
        <div id="authError" style="color: #ff6b6b; font-size: 13px; margin-bottom: 8px;"></div>
        <button id="loginBtn" style="width: 48%; margin-right: 4%;">Entrar</button>
        <button id="registerBtn" style="width: 48%;">Registrarme</button>
      </div>
      <div id="loggedInBox" style="display: none;">
        <span id="loggedInEmail"></span>
        <button id="logoutBtn" style="float: right;">Salir</button>
      </div>
    </div>

    <header class="topbar">
      <div class="balance">
        <span class="label">Saldo</span>
        <span class="value" id="balanceValue">-- USDT</span>
      </div>
      <button id="muteBtn" style="background:none;border:none;font-size:20px;cursor:pointer;">🔊</button>
    </header>

    <div class="jackpot-box">
      <div class="jackpot-label">🎰 Pozo acumulado 🎰</div>
      <div class="jackpot-value" id="jackpotValue">-- USDT</div>
    </div>

    <main class="machine">
      <div class="reels">
        <div id="reel0" class="reel">🍋</div>
        <div id="reel1" class="reel">🍋</div>
        <div id="reel2" class="reel">🍋</div>
      </div>
      <p id="resultMsg" class="result-msg"></p>
    </main>

    <footer class="controls">
      <div class="control-row">
        <label for="betAmount">Apuesta (USDT)</label>
        <input type="number" id="betAmount" value="0.15" min="0.15" step="0.05" />
      </div>
      <button id="spinBtn" class="btn">Girar 🎰</button>
      <p style="margin:0;font-size:11px;color:var(--text-dim);text-align:center;">
        🍋 2x · 🍒 3x · 🔔 6x · 💎 15x · ⭐ 30x (comodín) · 7️⃣7️⃣7️⃣ = JACKPOT
      </p>
    </footer>
  </div>

  <script src="auth.js"></script>
  <script src="game.js"></script>
  <script>
    const authErrorEl = document.getElementById('authError');
    const loginFormEl = document.getElementById('loginForm');
    const loggedInBoxEl = document.getElementById('loggedInBox');
    const loggedInEmailEl = document.getElementById('loggedInEmail');

    function refreshAuthUI(email) {
      if (isLoggedIn()) {
        loginFormEl.style.display = 'none';
        loggedInBoxEl.style.display = 'block';
        loggedInEmailEl.textContent = email || '';
      } else {
        loginFormEl.style.display = 'block';
        loggedInBoxEl.style.display = 'none';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      authErrorEl.textContent = '';
      try {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        await login(email, password);
        window.location.reload();
      } catch (err) {
        authErrorEl.textContent = err.message === 'INVALID_CREDENTIALS'
          ? 'Email o contraseña incorrectos.'
          : 'No se pudo iniciar sesión.';
      }
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
      authErrorEl.textContent = '';
      try {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        await register(email, password);
        window.location.reload();
      } catch (err) {
        authErrorEl.textContent = err.message === 'EMAIL_TAKEN'
          ? 'Ese email ya está registrado.'
          : 'No se pudo registrar (contraseña mínimo 6 caracteres).';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);

    refreshAuthUI();
  </script>
</body>
</html>
